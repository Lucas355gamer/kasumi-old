# Compila o Kasumi Old e publica o .cia/.3dsx numa release.
# O link fixo para o QR code do FBI fica:
#   https://github.com/<usuario>/<repositorio>/releases/latest/download/kasumi-old.cia
name: Compilar e publicar

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4

      - name: Ferramentas
        shell: bash
        run: |
          apt-get update && apt-get install -y --no-install-recommends unzip zip curl ca-certificates git g++ make file
          dkp-pacman -Sy --noconfirm --needed 3ds-libjpeg-turbo
          mkdir -p /tmp/tools && cd /tmp/tools

          # devolve o primeiro binario com esse nome que realmente executa aqui
          pick() {
            for f in $(find "$1" -type f -name "$2" 2>/dev/null); do
              chmod +x "$f"
              if "$f" >/dev/null 2>&1; then rc=0; else rc=$?; fi
              if [ $rc -ne 126 ] && [ $rc -ne 127 ]; then echo "$f"; return 0; fi
              echo "nao executa: $f ($(file -b "$f" | cut -c1-60))" >&2
            done
          }

          curl -fsSL -o makerom.zip https://github.com/3DSGuy/Project_CTR/releases/download/makerom-v0.19.0/makerom-v0.19.0-ubuntu_x86_64.zip
          unzip -o makerom.zip -d makerom
          MR="$(pick makerom makerom)"
          [ -n "$MR" ] || { echo "makerom nao executa"; exit 1; }
          install -m 755 "$MR" /usr/local/bin/makerom

          curl -fsSL -o bannertool.zip https://github.com/diasurgical/bannertool/releases/download/1.2.0/bannertool.zip
          unzip -o bannertool.zip -d bannertool
          BT="$(pick bannertool bannertool)"
          if [ -z "$BT" ]; then
            echo "Compilando o bannertool do codigo-fonte..."
            git clone --recursive --depth 1 https://github.com/diasurgical/bannertool bt-src
            make -C bt-src -j"$(nproc)" || true
            BT="$(pick bt-src bannertool)"
          fi
          if [ -n "$BT" ]; then
            install -m 755 "$BT" /usr/local/bin/bannertool
          else
            echo "::warning::bannertool indisponivel; o .cia sai sem banner animado"
          fi

      - name: Compilar .3dsx e .cia
        working-directory: 3ds
        shell: bash
        run: |
          make -f kasumi.mk
          if command -v bannertool >/dev/null; then
            make -f kasumi.mk cia
          else
            makerom -f cia -o kasumi-old.cia -elf kasumi-old.elf -rsf resources/app.rsf \
                    -icon kasumi-old.smdh -exefslogo -target t
          fi
          ls -la kasumi-old.3dsx kasumi-old.cia

      - name: Empacotar a ponte do PC
        run: |
          cd pc && zip -r ../kasumi-bridge-pc.zip . -x '__pycache__/*' '.deps_ok'

      - name: Publicar release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: Kasumi Old v0.1.${{ github.run_number }}
          make_latest: true
          body: |
            **Instalar pelo FBI:** Remote Install > Scan QR Code e aponte para o QR do README.
            Ou baixe `kasumi-old.cia` e instale pelo FBI, ou use `kasumi-old.3dsx` no Homebrew Launcher.
            No PC: baixe `kasumi-bridge-pc.zip` e rode `Iniciar Kasumi Bridge.bat`.
          files: |
            3ds/kasumi-old.cia
            3ds/kasumi-old.3dsx
            kasumi-bridge-pc.zip
