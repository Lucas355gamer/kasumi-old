# Compila o Kasumi Old e publica o .cia/.3dsx numa release.
# O link fixo para o QR code do FBI fica:
#   https://github.com/<usuario>/<repositorio>/releases/latest/download/kasumi-old.cia
name: Compilar e publicar

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4

      - name: Ferramentas
        run: |
          apt-get update && apt-get install -y --no-install-recommends unzip zip curl ca-certificates
          dkp-pacman -Sy --noconfirm --needed 3ds-libjpeg-turbo
          mkdir -p /tmp/tools && cd /tmp/tools
          curl -fsSL -o makerom.zip https://github.com/3DSGuy/Project_CTR/releases/download/makerom-v0.19.0/makerom-v0.19.0-ubuntu_x86_64.zip
          curl -fsSL -o bannertool.zip https://github.com/diasurgical/bannertool/releases/download/1.2.0/bannertool.zip
          unzip -o makerom.zip -d makerom
          unzip -o bannertool.zip -d bannertool
          install -m 755 "$(find makerom -type f -name makerom | head -n1)" /usr/local/bin/makerom
          BT="$(find bannertool -type f -name bannertool -path '*linux*' | head -n1)"
          [ -n "$BT" ] || BT="$(find bannertool -type f -name bannertool | head -n1)"
          install -m 755 "$BT" /usr/local/bin/bannertool
          makerom -version || true

      - name: Compilar .3dsx e .cia
        working-directory: 3ds
        run: |
          make -f kasumi.mk
          make -f kasumi.mk cia
          ls -la kasumi-old.3dsx kasumi-old.cia

      - name: Empacotar a ponte do PC
        run: |
          cd pc && zip -r ../kasumi-bridge-pc.zip . -x '__pycache__/*' '.deps_ok'

      - name: Publicar release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: Kasumi Old v0.1.${{ github.run_number }}
          make_latest: true
          body: |
            **Instalar pelo FBI:** Remote Install > Scan QR Code e aponte para o QR do README.
            Ou baixe `kasumi-old.cia` e instale pelo FBI, ou use `kasumi-old.3dsx` no Homebrew Launcher.
            No PC: baixe `kasumi-bridge-pc.zip` e rode `Iniciar Kasumi Bridge.bat`.
          files: |
            3ds/kasumi-old.cia
            3ds/kasumi-old.3dsx
            kasumi-bridge-pc.zip
