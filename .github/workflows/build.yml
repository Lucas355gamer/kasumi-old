# Compila o Kasumi Old e publica o .cia/.3dsx numa release.
# O link fixo para o QR code do FBI fica:
#   https://github.com/<usuario>/<repositorio>/releases/latest/download/kasumi-old.cia
name: Compilar e publicar

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # 1) compila no container do devkitPro (.elf, .3dsx, banner e icone)
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4

      - name: Ferramentas
        shell: bash
        run: |
          apt-get update && apt-get install -y --no-install-recommends unzip curl ca-certificates git g++ make
          dkp-pacman -Sy --noconfirm --needed 3ds-libjpeg-turbo
          mkdir -p /tmp/tools && cd /tmp/tools
          git clone --recursive --depth 1 https://github.com/diasurgical/bannertool bt-src
          make -C bt-src -j"$(nproc)"
          BT="$(find bt-src -type f -name bannertool -perm -u+x | head -n1)"
          install -m 755 "$BT" /usr/local/bin/bannertool

      - name: Compilar
        working-directory: 3ds
        shell: bash
        run: |
          make -f kasumi.mk
          bannertool makebanner -i resources/banner.png -a resources/silence.wav -o build/banner.bnr
          bannertool makesmdh -s "Kasumi Old" -l "Streaming de jogos para Old e New 3DS" -p "Kasumi Old" -i icon.png -o build/icon.icn

      - uses: actions/upload-artifact@v4
        with:
          name: 3ds-build
          path: |
            3ds/kasumi-old.elf
            3ds/kasumi-old.3dsx
            3ds/build/banner.bnr
            3ds/build/icon.icn

  # 2) monta o .cia no Ubuntu do proprio GitHub (o makerom precisa de glibc nova) e publica
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: 3ds-build
          path: 3ds

      - name: Montar o .cia
        working-directory: 3ds
        run: |
          curl -fsSL -o /tmp/makerom.zip https://github.com/3DSGuy/Project_CTR/releases/download/makerom-v0.19.0/makerom-v0.19.0-ubuntu_x86_64.zip
          unzip -o /tmp/makerom.zip -d /tmp/makerom
          MR="$(find /tmp/makerom -type f -name makerom | head -n1)"
          chmod +x "$MR"
          "$MR" -f cia -o kasumi-old.cia -elf kasumi-old.elf -rsf resources/app.rsf \
                -icon build/icon.icn -banner build/banner.bnr -exefslogo -target t
          ls -la kasumi-old.cia kasumi-old.3dsx

      - name: Empacotar a ponte do PC
        run: |
          cd pc && zip -r ../kasumi-bridge-pc.zip . -x '__pycache__/*' '.deps_ok'

      - name: Publicar release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: Kasumi Old v0.1.${{ github.run_number }}
          make_latest: true
          body: |
            **Instalar pelo FBI:** Remote Install > Scan QR Code e aponte para o QR do README.
            Ou baixe `kasumi-old.cia` e instale pelo FBI, ou use `kasumi-old.3dsx` no Homebrew Launcher.
            No PC: baixe `kasumi-bridge-pc.zip` e rode `Iniciar Kasumi Bridge.bat`.
          files: |
            3ds/kasumi-old.cia
            3ds/kasumi-old.3dsx
            kasumi-bridge-pc.zip
